function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function k64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
async function keyFrom(pw){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256' }, base, 256);
}
function show(html){   /* 잠금 화면을 다 그린 뒤에 통째로 바꿔야 겹치지 않음 */
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function(){ setTimeout(function(){ show(html); }, 0); }); return; }
  document.open(); document.write(html); document.close();
}
async function open_(raw, only){
  var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(D.iv) }, key, b64(D.ct)));
  if (only) return html;
  show(html);
}
var SK = 'mb.key.' + D.salt;
function saved(){ try { return localStorage.getItem(SK) || sessionStorage.getItem(SK); } catch(e){ return null; } }
(async function(){
  var s = saved();
  if (s) { try { await open_(b64(s)); return; } catch(e){ try { localStorage.removeItem(SK); sessionStorage.removeItem(SK); } catch(_){} } }
  document.getElementById('f').onsubmit = async function(ev){
    ev.preventDefault(); var err = document.getElementById('err'); err.textContent = '확인 중…';
    try {
      var keep = document.getElementById('keep').checked;   /* 화면이 바뀌기 전에 읽어 둠 */
      var raw = await keyFrom(document.getElementById('pw').value);
      var html = await open_(raw, true);
      try { sessionStorage.setItem(SK, k64(raw)); if (keep) localStorage.setItem(SK, k64(raw)); } catch(e){}
      show(html);
    } catch(e){ err.textContent = '비밀번호가 맞지 않습니다.'; }
  };
})();
</script></body></html>
